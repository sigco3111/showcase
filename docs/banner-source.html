<!DOCTYPE html>
<!--
  대표 저장소 배너 소스 — v4 voxel (2026-11-12)
  - 프로필 아바타·레포들의 도시 카드와 통일된 복셀 스타일
  - 배경 씬: https://raw.githubusercontent.com/sigco3111/sigco3111/main/1-showcase-banner-v4-scene.png
  - 렌더: 1280x320, deviceScaleFactor 2 → 2560x640 PNG
    출력물: sigco3111/sigco3111 저장소의 1-showcase-banner-v4.png
-->
<html lang="ko"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1280px; height:320px; overflow:hidden; }
body { font-family:'Noto Sans KR', sans-serif; color:#fff; position:relative; background:#101c3f; }
.bg {
  position:absolute; inset:0;
  background-image:url('https://raw.githubusercontent.com/sigco3111/sigco3111/main/1-showcase-banner-v4-scene.png');
  background-size:cover; background-position:center;
}
/* 좌측 텍스트 가독성용 스크림 — 배너 분위기(밤하늘)와 동일한 네이비 계열 */
.scrim {
  position:absolute; inset:0;
  background:linear-gradient(90deg,
    rgba(9,15,38,.80) 0%,
    rgba(9,15,38,.62) 24%,
    rgba(9,15,38,.28) 40%,
    rgba(9,15,38,0) 55%);
}
.wrap { position:relative; display:flex; height:100%; align-items:center; padding:0 56px; }
.left { width:560px; flex:none; }
.label {
  display:inline-flex; align-items:center; gap:8px;
  font-size:15px; letter-spacing:.22em; color:#7ee2a8; font-weight:700;
  margin-bottom:14px;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
}
.label .dot { width:9px; height:9px; border-radius:50%; background:#2ea043; box-shadow:0 0 10px #2ea043; }
h1 {
  font-size:52px; font-weight:700; letter-spacing:-.02em; line-height:1.08;
  text-shadow:0 2px 14px rgba(0,0,0,.6);
}
h1 em { font-style:normal; color:#7ee2a8; }
.sub {
  margin-top:14px; font-size:20px; color:#cdd8e6; font-weight:400;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.cta {
  margin-top:22px; display:inline-flex; align-items:center; gap:10px;
  background:#2ea043; color:#fff; font-size:19px; font-weight:700;
  padding:11px 22px; border-radius:999px;
  box-shadow:0 6px 24px rgba(46,160,67,.45), 0 2px 8px rgba(0,0,0,.4);
}
.cta span { font-size:21px; }
</style></head><body>
<div class="bg"></div>
<div class="scrim"></div>
<div class="wrap"><div class="left">
  <div class="label"><span class="dot"></span>SIGCO3111 · GITHUB</div>
  <h1>대표 저장소 <em>쇼케이스</em></h1>
  <div class="sub">원작 · 포크 · 한글화 — 웹 게임 · 시뮬레이션 · 도구 모음</div>
  <div class="cta">쇼케이스에서 전체 보기 <span>→</span></div>
</div></div>
</body></html>
