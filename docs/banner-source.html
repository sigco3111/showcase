<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1280px; height:320px; overflow:hidden; }
body {
font-family:'Noto Sans KR', sans-serif;
background:
radial-gradient(900px 500px at 88% -20%, rgba(46,160,67,.28), transparent 60%),
radial-gradient(700px 500px at 70% 130%, rgba(56,120,190,.20), transparent 60%),
linear-gradient(115deg, #0d1117 0%, #121a26 55%, #0e1720 100%);
color:#fff; position:relative;
}
.dots {
position:absolute; inset:0;
background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
background-size: 22px 22px;
}
.wrap { position:relative; display:flex; height:100%; align-items:center; padding:0 56px; }
.left { width:540px; flex:none; position:relative; z-index:10; }
.label {
display:inline-flex; align-items:center; gap:8px;
font-size:15px; letter-spacing:.22em; color:#7ee2a8; font-weight:700;
margin-bottom:14px;
}
.label .dot { width:9px; height:9px; border-radius:50%; background:#2ea043; box-shadow:0 0 10px #2ea043; }
h1 { font-size:52px; font-weight:700; letter-spacing:-.02em; line-height:1.08; }
h1 em { font-style:normal; color:#7ee2a8; }
.sub { margin-top:14px; font-size:20px; color:#b9c4d0; font-weight:400; }
.cta {
margin-top:22px; display:inline-flex; align-items:center; gap:10px;
background:#2ea043; color:#fff; font-size:19px; font-weight:700;
padding:11px 22px; border-radius:999px;
box-shadow:0 6px 24px rgba(46,160,67,.45);
}
.cta span { font-size:21px; }
.right { position:relative; flex:1; height:100%; }
/* ── 대표 저장소 느낌의 일반적 비주얼: 특정 프로젝트 무관 ── */
.card {
position:absolute; border-radius:12px; overflow:hidden;
box-shadow:0 14px 40px rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.14);
background:#161b22;
}
/* 저장소 카드 (GitHub repo 카드 느낌) */
.repo { width:300px; padding:16px 18px; }
.repo .rhead { display:flex; align-items:center; gap:9px; }
.repo .ricon {
width:22px; height:22px; border-radius:6px; flex:none;
background:#21262d; border:1px solid #30363d;
display:flex; align-items:center; justify-content:center;
}
.repo .ricon svg { width:13px; height:13px; }
.repo .rname { height:13px; width:148px; border-radius:6px; background:linear-gradient(90deg,#58a6ff,#79c0ff); opacity:.85; }
.repo .rdesc { margin-top:13px; }
.repo .rdesc div { height:9px; border-radius:5px; background:#30363d; margin-bottom:8px; }
.repo .rdesc div:nth-child(1) { width:92%; }
.repo .rdesc div:nth-child(2) { width:64%; }
.repo .rfoot { margin-top:12px; display:flex; align-items:center; gap:14px; }
.repo .lang { display:flex; align-items:center; gap:6px; }
.repo .lang i { width:11px; height:11px; border-radius:50%; display:block; }
.repo .lang b { height:8px; border-radius:4px; background:#30363d; display:block; }
.repo .star { margin-left:auto; display:flex; align-items:center; gap:5px; }
.repo .star svg { width:15px; height:15px; }
.repo .star b { width:26px; height:8px; border-radius:4px; background:#3d444d; display:block; }
/* 코드 창 */
.code { width:260px; padding:12px 14px 14px; }
.code .ctabs { display:flex; gap:6px; margin-bottom:12px; }
.code .ctabs i { width:9px; height:9px; border-radius:50%; display:block; }
.code .ln { display:flex; gap:7px; margin-bottom:8px; align-items:center; }
.code .ln b { height:8px; border-radius:4px; display:block; }
/* 잔디(기여 그래프) 카드 */
.grass { width:240px; padding:14px 16px; }
.grass .grid { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
.grass .grid i { aspect-ratio:1; border-radius:3px; display:block; }
/* 큰 별 장식 */
.bigstar { position:absolute; right:340px; top:118px; opacity:.16; z-index:1; }
.bigstar svg { width:150px; height:150px; }
/* 배치 */
.c1 { top:16px;  right:330px; transform:rotate(-4deg); z-index:3; }
.c2 { top:170px; right:392px; transform:rotate(3deg);  z-index:2; width:280px; }
.c3 { top:24px;  right:34px;  transform:rotate(4deg);  z-index:2; }
.c4 { top:158px; right:14px;  transform:rotate(-3deg); z-index:4; width:270px; }
</style></head><body><div class="dots"></div><div class="wrap"><div class="left"><div class="label"><span class="dot"></span>SIGCO3111 · GITHUB</div><h1>대표 저장소 <em>쇼케이스</em></h1><div class="sub">원작 · 포크 · 한글화 — 웹 게임 · 시뮬레이션 · 도구 모음</div><div class="cta">쇼케이스에서 전체 보기 <span>→</span></div></div><div class="right"><div class="bigstar"><svg viewBox="0 0 16 16" fill="#7ee2a8"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg></div><!-- 저장소 카드 --><div class="card repo c1"><div class="rhead"><span class="ricon"><svg viewBox="0 0 16 16" fill="#8b949e"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25v3.25a.25.25 0 0 0 .4.2l1.45-1.087a.249.249 0 0 1 .3 0L8.6 15.7a.25.25 0 0 0 .4-.2v-3.25a.25.25 0 0 0-.25-.25h-3.5a.25.25 0 0 0-.25.25Z"/></svg></span><span class="rname"></span></div><div class="rdesc"><div></div><div></div></div><div class="rfoot"><span class="lang"><i style="background:#f1e05a"></i><b style="width:34px"></b></span><span class="lang"><i style="background:#58a6ff"></i><b style="width:26px"></b></span><span class="star"><svg viewBox="0 0 16 16" fill="#e3b341"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><b></b></span></div></div><!-- 코드 창 --><div class="card code c2"><div class="ctabs"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="ln"><b style="width:34px;background:#ff7b72"></b><b style="width:64px;background:#79c0ff"></b><b style="width:26px;background:#d2a8ff"></b></div><div class="ln"><b style="width:14px;background:#30363d"></b><b style="width:52px;background:#7ee2a8"></b><b style="width:38px;background:#79c0ff"></b></div><div class="ln"><b style="width:14px;background:#30363d"></b><b style="width:80px;background:#a5d6ff"></b><b style="width:22px;background:#ff7b72"></b></div><div class="ln"><b style="width:14px;background:#30363d"></b><b style="width:44px;background:#d2a8ff"></b><b style="width:58px;background:#7ee2a8"></b></div><div class="ln"><b style="width:60px;background:#ff7b72"></b><b style="width:30px;background:#79c0ff"></b></div></div><!-- 잔디(기여 그래프) 카드 --><div class="card grass c3"><div class="grid" id="grass"></div></div><!-- 저장소 카드 2 --><div class="card repo c4"><div class="rhead"><span class="ricon"><svg viewBox="0 0 16 16" fill="#8b949e"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25v3.25a.25.25 0 0 0 .4.2l1.45-1.087a.249.249 0 0 1 .3 0L8.6 15.7a.25.25 0 0 0 .4-.2v-3.25a.25.25 0 0 0-.25-.25h-3.5a.25.25 0 0 0-.25.25Z"/></svg></span><span class="rname" style="width:120px"></span></div><div class="rdesc"><div style="width:84%"></div><div style="width:52%"></div></div><div class="rfoot"><span class="lang"><i style="background:#7ee2a8"></i><b style="width:30px"></b></span><span class="lang"><i style="background:#f778ba"></i><b style="width:24px"></b></span><span class="star"><svg viewBox="0 0 16 16" fill="#e3b341"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg><b></b></span></div></div></div></div><script>
// 잔디 색상: GitHub 기여 그래프 팔레트, 고정 패턴(특정 데이터 아님)
const palette = ['#161b22','#0e4429','#006d32','#26a641','#39d353'];
const pattern = [0,1,2,1,0,3,2,1,4,2, 1,0,3,4,2,1,0,2,1,3, 2,4,1,0,2,3,1,2,0,1];

for (const p of pattern){
const s=document.createElement('i');
s.style.background = palette[p];
g.appendChild(s);
}
</script></body></html>
